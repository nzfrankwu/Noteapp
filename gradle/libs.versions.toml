[versions]
agp = "9.5.1"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.09.00"
ksp = "2.3.14"
room = "2.8.5"
# Newest kotlinx.serialization built for Kotlin 2.2 (1.10+ needs Kotlin 2.3).
kotlinxSerialization = "1.9.0"
navigation3 = "1.2.1"
okhttp = "5.5.1"
datastore = "1.3.0"
work = "2.12.0"
# Jetpack Ink (handwriting): 1.0.0 is the newest stable (1.1 is alpha). Approved by the user on 15 Nov 2026.
ink = "1.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
